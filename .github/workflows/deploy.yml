name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages:write + id-token:write are what deploy-pages needs. contents stays
# read-only because nothing is ever pushed back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress is deliberately false: killing a
# half-finished deploy can leave the site serving a partial tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # No build step -- repo paths are the published paths. This only picks out
      # what should be public, so README.md and examples/ stay off the live site.
      - name: Assemble publish tree
        run: |
          mkdir -p _site
          cp -R api static CNAME .nojekyll index.html _site/

      - uses: actions/configure-pages@v6
        with:
          # Pages is off on a fresh repo, and this action only *checks* by
          # default (enablement: false), which fails the whole run. Letting it
          # turn Pages on keeps the workflow self-contained -- no manual
          # Settings -> Pages step, and it re-applies if someone resets it.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 tars with `--exclude=.[^/]*` unless this is on, which would
          # silently drop .nojekyll from the published tree.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5

      # Verified from inside the runner on purpose: github.io is blocked on some
      # networks (including the one this repo was authored from), so a curl from
      # a dev machine cannot confirm the site actually serves what we expect.
      # Checks content-type too -- a JSON route silently served as text/plain
      # would break clients that branch on it.
      - name: Smoke test the deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          echo "Testing $base"

          # deploy-pages returns before the CDN has finished propagating.
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/api/index.json" || true)
            [ "$code" = "200" ] && break
            echo "  waiting for propagation (attempt $i, got $code)"
            sleep 10
          done

          fail=0
          check() {
            # curl already emits "000 " via -w on failure, so don't append another
            # fallback line -- that would concatenate into a misleading "000 000 -".
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 "$base$1") || true
            [ -n "$out" ] || out="000 -"
            code=${out%% *}
            type=${out#* }
            verdict=ok
            [ "$code" = "$2" ] || verdict=FAIL
            case "$type" in "$3"*) ;; *) verdict=FAIL ;; esac
            printf '  %-20s %s  %-34s %s\n' "$1" "$code" "$type" "$verdict"
            [ "$verdict" = ok ] || fail=1
          }

          check /                 200 text/html
          check /api/index.json   200 application/json
          check /api/images.json  200 application/json
          check /static/logo.png  200 image/png
          check /static/hero.png  200 image/png
          exit $fail

      # The mirror caches @main for 12h (s-maxage=43200), which for API endpoints
      # means a client falling back could read half-day-old data. jsDelivr cannot
      # be configured, but it can be purged, so do that on every publish.
      #
      # Only JSON and HTML: purge reports `providers: {CF, FY}` and measured, it
      # clears cdn/fastly but NOT gcore. Since images are mirrored via gcore
      # (cdn 301s them to raw), purging them would spend rate-limited requests
      # for no effect -- a replaced image stays up to 12h stale on gcore, which
      # is why the docs say to rename rather than overwrite.
      #
      # Never fails the job: the deploy already succeeded, and purge is
      # rate-limited ("throttled" in its response), so a miss must not turn a
      # good deployment red.
      - name: Purge the jsDelivr JSON mirror
        continue-on-error: true
        run: |
          cd _site
          find . -type f \( -name '*.json' -o -name '*.html' \) | sed 's|^\./||' | while read -r p; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$p" || true)
            printf '  %-24s %s\n' "$p" "${code:-000}"
          done
